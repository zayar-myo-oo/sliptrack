name: sliptrack
description: Private, on-device e-slip finance tracking.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.0.0
  drift: ^2.35.2
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  local_auth: ^3.0.0
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
